<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>

14px #56baff88}#cta{position:absolute;top:124px;left:60px;right:60px;text-align:center;font-size:37px;font-weight:650;line-height:1.5;white-space:pre-line}.hi{color:#56baff;text-shadow:0 0 14px #56baff99;font-weight:800}#identity{position:absolute;left:70px;top:1330px;background:#03131fd9;border-left:4px solid #56baff;padding:14px 25px;font-size:32px;line-height:1.4;white-space:pre-line}#identity b{font-size:46px;color:#a7ddff}.callout{position:absolute;width:296px;top:1250px;padding:20px;text-align:center;border-radius:22px;background:linear-gradient(120deg,#062d4eed,#03131fd9);border:1px solid #56baff55;box-shadow:0 10px 30px #0007;color:#a9dfff}.callout .icon{width:104px;height:104px;margin:auto}.callout .label{font-size:32px;font-weight:700;margin-top:12px;text-shadow:0 2px 8px #000}.callout.left{left:32px}.callout.right{right:32px}#stats{position:absolute;top:1250px;left:64px;right:64px;display:flex;gap:30px;justify-content:space-evenly;text-align:center}#stats .number{font-size:106px;line-height:1.2;font-weight:800;color:#56baff;text-shadow:0 0 24px #56baff88}#stats .label{font-size:33px;font-weight:700;text-shadow:0 3px 8px #000}#stats .blocks{display:flex;gap:5px;margin-top:12px;justify-content:center}#stats .blocks i{width:17px;height:13px;background:#56baff;border-radius:3px}#stats .stat{background:#03131f99;border-radius:22px;padding:18px 26px}#source-label{position:absolute;left:26px;top:995px;font-size:24px;padding:6px 14px;background:#03131fd9}
</style></head><body><div id="root"><div id="header"><img id="header-photo" class="photo"><div class="shade"></div><div id="logo"></div><div id="series"></div><div id="title"></div><div id="rail"></div></div><div id="source-label"></div><div id="cap"></div><div id="identity"></div><div id="callouts"></div><div id="stats"></div><div id="footer"><img id="footer-photo" class="photo"><div class="shade"></div><div id="graduate"></div><div id="cta"></div></div></div><script>
const D=__DATA__;const el=id=>document.getElementById(id);let current=-1;
const svg=body=>'<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round">'+body+'</svg>';
const ICONS={slides:svg('<rect x="12" y="17" width="76" height="54" rx="6"/><path d="M50 71v17M29 88h42M37 29v29l27-14z"/>'),sheet:svg('<rect x="17" y="10" width="66" height="80" rx="4"/><path d="M17 31h66M17 51h66M17 71h66M39 10v80M61 10v80"/>'),cube:svg('<path d="M50 7l37 21v44L50 94 13 72V28zM13 28l37 22 37-22M50 50v44"/>'),check:svg('<rect x="16" y="13" width="68" height="76" rx="7"/><path d="M29 41l9 9 20-22M29 69h39"/>'),dashboard:svg('<rect x="10" y="13" width="80" height="74" rx="6"/><path d="M10 35h80M38 35v52M53 71V56M65 71V47M77 71V61"/>'),image:svg('<rect x="10" y="15" width="80" height="70" rx="7"/><circle cx="32" cy="35" r="7"/><path d="M10 73l25-23 18 14 16-22 21 27"/>'),web:svg('<rect x="9" y="13" width="82" height="74" rx="6"/><path d="M9 33h82M19 23h4M31 23h4M43 23h4M25 56l-8 8 8 8M75 56l8 8-8 8M59 46L43 79"/>')};
function rich(node,text){node.replaceChildren();let pos=0;const re=/\[\[(.*?)\]\]/g;for(const m of String(text||'').matchAll(re)){node.append(document.createTextNode(text.slice(pos,m.index)));let s=document.createElement('span');s.className='hi';s.textContent=m[1];node.append(s);pos=m.index+m[0].length}node.append(document.createTextNode(String(text||'').slice(pos)))}
function fit(node,max,min){node.style.fontSize=max+'px';while((node.scrollHeight>node.clientHeight||node.scrollWidth>node.clientWidth)&&max>min)node.style.fontSize=(--max)+'px'}
function intro(s,i){current=i;rich(el('title'),s.title||'');fit(el('title'),51,32);el('rail').replaceChildren();(D.steps||[]).forEach((t,k)=>{let n=document.createElement('span');n.textContent=t;n.className=k===(s.step||0)?'active':'';el('rail').append(n)});el('rail').style.display=s.layout==='speaker'?'none':'flex';el('source-label').textContent=s.source_label||'';el('source-label').style.display=s.source_label?'block':'none';el('callouts').replaceChildren();(s.callouts||[]).forEach(c=>{let n=document.createElement('div');n.className='callout '+(c.side||'left');let icon=document.createElement('div');icon.className='icon';icon.innerHTML=ICONS[c.icon||'check'];let label=document.createElement('div');label.className='label';label.textContent=c.text||'';n.append(icon,label);el('callouts').append(n)});el('stats').replaceChildren();(s.stats||[]).slice(0,2).forEach(c=>{let n=document.createElement('div');n.className='stat';let num=document.createElement('div');num.className='number';num.textContent=c.value||(c.kind==='time_fraction'?((c.numerator||1)+'/'+(c.denominator||10)):c.kind==='multiple'?'1×':'');let label=document.createElement('div');label.className='label';label.textContent=c.label;n.append(num,label);if(c.kind==='time_fraction'){let blocks=document.createElement('div');blocks.className='blocks';for(let k=0;k<Math.min(20,c.denominator||10);k++){let block=document.createElement('i');blocks.append(block)}n.append(blocks)}el('stats').append(n)});el('header').style.height=s.layout==='speaker'?'310px':(D.geometry.screen[1]+'px')}
window.seek=t=>{let i=D.scenes.findIndex(s=>t>=s.cut_start&&t<s.cut_end);if(i<0)i=D.scenes.length-1;const s=D.scenes[i];if(i!==current)intro(s,i);const local=t-s.cut_start;const cap=D.captions_final.find(c=>t>=c.start&&t<c.end);rich(el('cap'),cap?cap.text:'');fit(el('cap'),43,28);el('cap').style.opacity=cap?'1':'.9';const showIdentity=i===0&&t<Math.min(2.6,s.duration);el('identity').style.display=showIdentity&&D.speaker_name?'block':'none';[...el('callouts').children].forEach((n,k)=>{const c=s.callouts[k],a=c.at||0,b=Math.min(s.duration,a+(c.duration||2));const fade=Math.max(0,Math.min(1,(local-a)/.35,(b-local)/.3));const ease=1-Math.pow(1-fade,3);n.style.opacity=fade;n.style.transform=`translateX(${(1-ease)*(c.side==='right'?100:-100)}px)`});el('stats').style.opacity=s.stats?Math.min(1,Math.max(0,(local-.7)/.4)):0;el('stats').style.transform=`translateY(${Math.max(0,1-(local-.7)/.4)*28}px)`;const progress=Math.max(0,Math.min(1,(local-.7)/.8));[...el('stats').children].forEach((n,k)=>{const stat=s.stats[k];if(stat.kind==='multiple')n.querySelector('.number').textContent=Math.round((stat.from||1)+((stat.to||1)-(stat.from||1))*progress)+'×';if(stat.kind==='time_fraction')[...n.querySelectorAll('i')].forEach((block,num)=>block.style.opacity=num<(stat.numerator||1)?1:1-progress*.85)})};
const G=D.geometry;for(const [id,box] of [['cap',G.caption]]){const n=el(id);n.style.left=box[0]+'px';n.style.top=box[1]+'px';n.style.width=box[2]+'px';n.style.height=box[3]+'px'}el('footer').style.top=G.footer_top+'px';el('title').style.top=G.title_top+'px';el('rail').style.top=G.workflow_rail_top+'px';el('source-label').style.top=(G.screen[1]+G.screen[3]-55)+'px';
const brand=D.brand||{};if(D.logo){const img=document.createElement('img');img.src=D.logo;el('logo').append(img)}else el('logo').textContent=brand.name||'';
el('series').textContent=brand.series||'AI Agent 工作流';el('graduate').textContent=D.series||'';rich(el('cta'),D.cta||'');el('identity').textContent=D.speaker_name||'';
for(const key of ['header','footer'])if(D[key+'_photo'])el(key+'-photo').src=D[key+'_photo'];else el(key+'-photo').style.display='none';
Promise.all([document.fonts.ready,...[...document.images].filter(i=>i.src).map(i=>i.decode().catch(()=>{}))]).then(()=>{window.seek(0);window.ready=true});
</script></body></html>
